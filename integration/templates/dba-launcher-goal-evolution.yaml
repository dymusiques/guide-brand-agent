# Generated by scripts/setup-background-goal-evolution.sh
# Owner schedule: daily 09:00 Asia/Shanghai (2026-10-27). Interval changes → BACKGROUND-CYCLE-INTERVAL-TRIGGER.md
server:
  host: 127.0.0.1
  port: 7997

logging:
  dir: logs
  heartbeat_retention_days: 30
  output_retention_days: 30

storage:
  sqlite_path: state/launcher.db

periodic_jobs:
  dba_goal_evolution_daily:
    label: dba_goal_evolution_daily
    enabled: true
    command: ["bash", "scripts/background-goal-evolution-cycle.sh"]
    cwd: __REPO_ROOT__
    env:
      GOAL_EVOLUTION_DEEP: "1"
    schedule:
      type: daily
      time: "09:00"
      timezone: Asia/Shanghai
    overlap_policy: skip
    misfire_policy: skip
    timeout: 3600
