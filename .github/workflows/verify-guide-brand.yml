name: verify-guide-brand

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdocs-skill
        run: pip install -e vendor/gdocs-skill
      - name: Full integration build — CI tier (00 Manager capstone)
        run: VERIFY_TIER=ci bash scripts/verify-all.sh
        env:
          VERIFY_SKIP_INTEGRATION_MATRIX: "1"
