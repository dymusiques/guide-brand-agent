    let html = `<div class="meta"><span class="badge">${d.badge}</span><span class="clarity ${cl}">${d.clarityLabel}</span></div>`;
    html += `<h2>${d.title}</h2><p class="lead">${d.lead}</p>`;
    (d.sections || []).forEach((s) => {
      html += `<h3>${s.h}</h3>`;
      if (s.cmd) html += `<code class="cmd">${s.cmd}</code>`;
      if (s.items) {
        html += "<ul>" + s.items.map((it) =>
          `<li>${it.includes("/") || it.includes("bash") || it.includes(".md") ? `<span class="path">${it}</span>` : it}</li>`
        ).join("") + "</ul>";
      }
    });
    panelBody.innerHTML = html;
    panel.classList.add("open");
    backdrop.classList.add("open");
  }

  function closePanel() {
    panel.classList.remove("open");
    backdrop.classList.remove("open");
    if (selectedG) selectedG.classList.remove("selected");
    selectedG = null;
    activeId = null;
    dock.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
  }
  document.getElementById("close").onclick = closePanel;
  backdrop.onclick = closePanel;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

  function selectNode(g, id) {
    if (selectedG) selectedG.classList.remove("selected");
    selectedG = g;
    if (g) g.classList.add("selected");
    document.querySelectorAll(".tool-chip").forEach((el) => {
      el.classList.toggle("selected", el.dataset.id === id);
    });
    dock.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
    renderPanel(id);
  }

  function bindNode(g, id) {
    g.classList.add("node-hit");
    const hit = g.querySelector(".hit-target");
    const fn = (e) => { e.preventDefault(); e.stopPropagation(); selectNode(g, id); };
    (hit || g).addEventListener("click", fn);
  }

  const vbW = 960;
  const vbH = 720;
  const vbY = -380;
  svg.setAttribute("viewBox", `${-vbW/2} ${vbY} ${vbW} ${vbH}`);
  svg.setAttribute("data-layout-version", LAYOUT_VERSION);

  const mainNodes = nodes.filter((n) => n.tier !== "tool");

  const cg = document.createElementNS("http://www.w3.org/2000/svg", "g");
  cg.setAttribute("data-node-id", "ceo");
  cg.setAttribute("transform", `translate(${CX},${CY})`);
  const cc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  cc.setAttribute("class", "disc");
  cc.setAttribute("r", String(R_CEO));
  cc.setAttribute("fill", "#1f6feb");
  cc.setAttribute("stroke", "#79c0ff");
  cc.setAttribute("stroke-width", "3");
  cg.appendChild(cc);
  [["00", -8], ["Manager", 8], ["CEO", 22]].forEach(([txt, y]) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("class", txt === "00" ? "lbl" : "lbl-sm");
    t.setAttribute("y", y);
    t.textContent = txt;
    cg.appendChild(t);
  });
  const hitC = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  hitC.setAttribute("class", "hit-target");
  hitC.setAttribute("r", String(R_CEO + 10));
  cg.appendChild(hitC);
  bindNode(cg, "ceo");
  svg.appendChild(cg);

  mainNodes.forEach((n) => {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("class", n.cls);
    line.setAttribute("x1", String(CX));
    line.setAttribute("y1", String(CY));
    line.setAttribute("x2", String(n.x));
    line.setAttribute("y2", String(n.y));
    svg.appendChild(line);

    const nr = n.sub ? 34 : 46;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    g.setAttribute("data-node-id", n.id);
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "disc");
    c.setAttribute("r", String(nr));
    c.setAttribute("fill", n.color);
    c.setAttribute("stroke", "#fff");
    c.setAttribute("stroke-width", n.sub ? "2" : "3");
    g.appendChild(c);
    const labelY = nr + 16;
    n.lines.forEach((ln, i) => {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("class", i === 0 ? "lbl" : "lbl-sm");
      t.setAttribute("y", labelY + i * 12);
      t.textContent = ln;
      g.appendChild(t);
    });
    const hit = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    hit.setAttribute("class", "hit-target");
    hit.setAttribute("r", String(nr + 8));
    g.appendChild(hit);
    bindNode(g, n.id);
    svg.appendChild(g);
  });

  const shelf = document.getElementById("tool-shelf");
  const shelfTitle = document.createElement("h3");
  shelfTitle.textContent = "Layer 3 · 工具箱（与 CEO 圆图分离 · 不会叠在蓝圈上）";
  shelf.appendChild(shelfTitle);
  TOOL_CHIPS.forEach((t) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tool-chip";
    btn.dataset.id = t.id;
    btn.innerHTML = `<strong>${t.title}</strong><span>${t.sub}</span>`;
    btn.onclick = () => selectNode(null, t.id);
    shelf.appendChild(btn);
  });

  function addDockBtn(id) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.id = id;
    btn.textContent = DETAIL[id].title.replace(" · ", " ").slice(0, 18);
    btn.onclick = () => {
      const g = svg.querySelector(`[data-node-id="${id}"]`);
      selectNode(g, id);
    };
    dock.appendChild(btn);
  }
  DOCK_GROUPS.forEach((grp) => {
    const h = document.createElement("div");
    h.className = "dock-group";
    h.textContent = grp.label;
    dock.appendChild(h);
    grp.ids.forEach((id) => { if (DETAIL[id]) addDockBtn(id); });
  });
})();
  </script>
</body>
</html>
